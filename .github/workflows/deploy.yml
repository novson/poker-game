name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOY_HOST: 139.224.254.109
  DEPLOY_USER: root
  BACKEND_JAR: poker-backend-1.0.0.jar
  BACKEND_HEALTH_URL: http://127.0.0.1:18080/actuator/health

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run backend tests
        working-directory: backend
        run: mvn -B test

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    outputs:
      backend-changed: ${{ steps.changes.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect backend changes
        id: changes
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD | grep -q '^backend/'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Package backend jar
        working-directory: backend
        run: mvn -B -DskipTests package
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: |
            backend/target/poker-backend-1.0.0.jar
            frontend/dist
          retention-days: 7

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deploy-bundle
          path: bundle
      - name: Check deploy key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::DEPLOY_SSH_KEY 未配置。请在仓库 Settings → Secrets and variables → Actions 添加部署私钥。"
            exit 1
          fi
      - name: Set up SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Upload frontend bundle
        run: |
          tar -czf /tmp/poker-dist.tgz -C bundle/frontend/dist .
          scp -O -B -i ~/.ssh/deploy_key /tmp/poker-dist.tgz \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/poker-dist-actions.tgz"
      - name: Swap frontend dist on server
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'REMOTE'
          set -e
          BK=/opt/poker-game/backups/$(date +%Y%m%d-%H%M%S)-actions-frontend
          mkdir -p "$BK"
          rm -rf "$BK/dist"
          cp -a /opt/poker-game/frontend/dist "$BK/dist"
          rm -rf /opt/poker-game/frontend/dist.new
          mkdir -p /opt/poker-game/frontend/dist.new
          tar -xzf /tmp/poker-dist-actions.tgz -C /opt/poker-game/frontend/dist.new
          test -f /opt/poker-game/frontend/dist.new/index.html
          rm -rf /opt/poker-game/frontend/dist
          mv /opt/poker-game/frontend/dist.new /opt/poker-game/frontend/dist
          rm -f /tmp/poker-dist-actions.tgz
          echo FRONTEND_DEPLOY_OK
          ls -1 /opt/poker-game/frontend/dist/assets | grep '^index-' | head -5
          REMOTE

  deploy-backend:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.backend-changed == 'true'
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deploy-bundle
          path: bundle
      - name: Check deploy key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::DEPLOY_SSH_KEY 未配置。请在仓库 Settings → Secrets and variables → Actions 添加部署私钥。"
            exit 1
          fi
      - name: Set up SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Upload backend jar
        run: |
          scp -O -B -i ~/.ssh/deploy_key \
            "bundle/backend/target/$BACKEND_JAR" \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/poker-backend-actions.jar"
      - name: Swap jar and restart service
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'REMOTE'
          set -e
          JAR=/opt/poker-game/backend/target/poker-backend-1.0.0.jar
          BK=/opt/poker-game/backups/$(date +%Y%m%d-%H%M%S)-actions-backend
          mkdir -p "$BK"
          cp -a "$JAR" "$BK/"
          mv /tmp/poker-backend-actions.jar "$JAR"
          systemctl restart poker-game
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/actuator/health | grep -q '"UP"'; then
              echo BACKEND_DEPLOY_OK
              exit 0
            fi
            sleep 2
          done
          echo BACKEND_HEALTH_TIMEOUT
          journalctl -u poker-game -n 50 --no-pager
          exit 1
          REMOTE
