server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: poker-backend

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

poker:
  allowed-origins: ${POKER_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8088,http://127.0.0.1:8088}
  admin-token: ${POKER_ADMIN_TOKEN:}
  settings-file: ${POKER_SETTINGS_FILE:}
  accounts-file: ${POKER_ACCOUNTS_FILE:}

